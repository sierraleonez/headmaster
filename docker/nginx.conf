server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Built assets and anything else in public/ are served straight from disk.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(build|storage)/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        # Drafting a plan is slow; nginx must outlast the request, not the job.
        fastcgi_read_timeout 120;
    }

    # Nothing else in the app is reachable over HTTP.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
